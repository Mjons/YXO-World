<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YXO Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Brand colours from the main site. Series colours checked with the
         dataviz palette validator for colour-blind separation, both themes. */
      :root {
        --surface: #f6f2ea;
        --card: #fffdf8;
        --ink: #0c1140;
        --ink-2: rgba(12, 17, 64, 0.72);
        --ink-3: rgba(12, 17, 64, 0.54);
        --line: rgba(12, 17, 64, 0.12);
        --grid: rgba(12, 17, 64, 0.09);
        --axis: rgba(12, 17, 64, 0.32);
        --s1: #0e8f86;
        --s1-track: rgba(14, 143, 134, 0.16);
        --s2: #5a4fcf;
        --good: #0e8f86;
        --crit: #d6452f;
        --warn-bg: #fff4d1;
        --warn-line: #f0c040;
        --banner: #ffe84a;
        --banner-ink: #0c1140;
        --chip: #ece5d8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: #0c1140;
          --card: #141a4d;
          --ink: #f6f2ea;
          --ink-2: rgba(246, 242, 234, 0.78);
          --ink-3: rgba(246, 242, 234, 0.56);
          --line: rgba(246, 242, 234, 0.14);
          --grid: rgba(246, 242, 234, 0.09);
          --axis: rgba(246, 242, 234, 0.34);
          --s1: #1fa898;
          --s1-track: rgba(31, 168, 152, 0.22);
          --s2: #8579f2;
          --good: #33e9a6;
          --crit: #ff6f5a;
          --warn-bg: rgba(255, 195, 77, 0.1);
          --warn-line: rgba(255, 195, 77, 0.5);
          --chip: #1d2460;
        }
      }
      :root[data-theme="dark"] {
        --surface: #0c1140;
        --card: #141a4d;
        --ink: #f6f2ea;
        --ink-2: rgba(246, 242, 234, 0.78);
        --ink-3: rgba(246, 242, 234, 0.56);
        --line: rgba(246, 242, 234, 0.14);
        --grid: rgba(246, 242, 234, 0.09);
        --axis: rgba(246, 242, 234, 0.34);
        --s1: #1fa898;
        --s1-track: rgba(31, 168, 152, 0.22);
        --s2: #8579f2;
        --good: #33e9a6;
        --crit: #ff6f5a;
        --warn-bg: rgba(255, 195, 77, 0.1);
        --warn-line: rgba(255, 195, 77, 0.5);
        --chip: #1d2460;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font:
          15px/1.45 "Inter",
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      @media (min-width: 720px) {
        .wrap {
          padding: 32px 32px 64px;
        }
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .brand b {
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .brand span {
        font-size: 18px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .updated {
        font-size: 13px;
        color: var(--ink-3);
        margin-top: 2px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }
      .ghost {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink-2);
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 999px;
      }
      .ghost:hover {
        color: var(--ink);
      }

      .banner {
        background: var(--banner);
        color: var(--banner-ink);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 16px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        margin-bottom: 14px;
      }
      .filter {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .filter-label {
        font-size: 12px;
        color: var(--ink-3);
      }
      .seg {
        display: inline-flex;
        flex-wrap: wrap;
        background: var(--chip);
        border-radius: 999px;
        padding: 3px;
      }
      .seg button {
        border: 0;
        background: none;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-2);
        padding: 6px 12px;
        border-radius: 999px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .src {
        display: flex;
        gap: 6px;
        align-items: baseline;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .src b {
        font-weight: 600;
      }
      .src .why {
        color: var(--ink-2);
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
      }
      .tile.accent {
        border-color: var(--s1);
        box-shadow: inset 0 0 0 1px var(--s1);
      }
      .tile .l {
        font-size: 13px;
        color: var(--ink-2);
      }
      .tile .v {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 2px 0;
      }
      .tile .v.na {
        color: var(--ink-3);
      }
      .tile .s {
        font-size: 12px;
        color: var(--ink-3);
      }

      .panels {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      @media (max-width: 860px) {
        .panels {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px 18px;
        min-width: 0;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .card h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
      }
      .card .sub {
        font-size: 13px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .chart svg {
        display: block;
        overflow: visible;
      }
      .empty {
        padding: 32px 0;
        color: var(--ink-3);
        font-size: 14px;
        text-align: center;
      }
      .note {
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 10px;
      }

      .legend {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: var(--ink-2);
        margin-bottom: 4px;
      }
      .legend i {
        display: inline-block;
        width: 16px;
        height: 3px;
        border-radius: 2px;
        vertical-align: middle;
        margin-right: 6px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      th {
        font-weight: 600;
        color: var(--ink-2);
      }
      .n {
        text-align: right;
      }

      .seat {
        margin-bottom: 18px;
      }
      .seat:last-child {
        margin-bottom: 0;
      }
      .seat-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .seat-top b {
        font-weight: 600;
      }
      .seat-top span {
        color: var(--ink-3);
        font-size: 13px;
      }
      .meter {
        height: 12px;
        background: var(--s1-track);
        border-radius: 6px;
        overflow: hidden;
      }
      .meter div {
        height: 100%;
        background: var(--s1);
        border-radius: 6px 4px 4px 6px;
      }
      .seat-num {
        font-size: 13px;
        color: var(--ink-2);
        margin-top: 6px;
      }

      .reminders {
        margin-top: 16px;
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        border-radius: 14px;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 24px;
        font-size: 14px;
      }
      .reminders b {
        font-weight: 600;
      }

      #tip {
        position: fixed;
        pointer-events: none;
        background: var(--ink);
        color: var(--surface);
        font-size: 12.5px;
        line-height: 1.45;
        padding: 8px 10px;
        border-radius: 8px;
        max-width: 260px;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 10;
      }
      #tip.on {
        opacity: 1;
      }
      .mark:focus {
        outline: none;
      }
      .mark:focus-visible {
        stroke: var(--ink);
        stroke-width: 2;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="brand"><b>YXO</b><span>Dashboard</span></div>
          <div class="updated" id="updated"></div>
        </div>
        <button class="ghost" id="sampleBtn" hidden></button>
      </header>

      <div class="banner" id="banner" hidden></div>

      <div class="filters">
        <div class="filter">
          <span class="filter-label">Period</span
          ><span class="seg" id="rangeSeg"></span>
        </div>
        <div class="filter">
          <span class="filter-label">Workshop</span
          ><span class="seg" id="wsSeg"></span>
        </div>
      </div>

      <div class="sources" id="sources"></div>
      <div class="tiles" id="tiles"></div>

      <div class="panels">
        <section class="card" id="funnel">
          <div class="card-head">
            <div>
              <h2>Funnel</h2>
              <div class="sub">
                From visit to payment, with the two drop-off points
              </div>
            </div>
            <button class="ghost" data-table="funnel">Table</button>
          </div>
          <div class="chart"></div>
        </section>
        <section class="card" id="trend">
          <div class="card-head">
            <div>
              <h2>Signups and paid students</h2>
              <div class="sub" id="trendSub"></div>
            </div>
            <button class="ghost" data-table="trend">Table</button>
          </div>
          <div class="chart"></div>
        </section>
        <section class="card" id="heard">
          <div class="card-head">
            <div>
              <h2>How they heard about YXO</h2>
              <div class="sub">Waitlist answers in this period, all cities</div>
            </div>
            <button class="ghost" data-table="heard">Table</button>
          </div>
          <div class="chart"></div>
        </section>
        <section class="card" id="seats">
          <div class="card-head">
            <div>
              <h2>Seats left</h2>
              <div class="sub">Paid students against capacity, all time</div>
            </div>
          </div>
          <div class="chart"></div>
        </section>
      </div>

      <div class="reminders" id="reminders"></div>
    </div>
    <div id="tip" role="status"></div>

    <script src="sample-data.js"></script>
    <script src="data.js"></script>
    <script>
      const REAL = window.YXO_DATA || null;
      const SAMPLE = window.YXO_SAMPLE;
      const state = { range: "30", ws: "all", sample: !REAL, tables: {} };

      const RANGES = [
        ["7", "7 days"],
        ["30", "30 days"],
        ["90", "90 days"],
        ["all", "All time"],
      ];
      const MONTHS = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const SOURCE_NAMES = {
        stripe: "Stripe",
        plausible: "Plausible",
        waitlist: "Waitlist signups",
        requests: "Workshop requests",
      };
      const NEED = {
        stripe: "Needs Lily's Stripe",
        plausible: "Needs Plausible",
        forms: "Needs Plausible",
      };

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const addDays = (iso, n) => {
        const d = new Date(iso + "T12:00:00Z");
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      };
      const daysBetween = (a, b) =>
        Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
      const fmtDay = (iso) =>
        `${MONTHS[+iso.slice(5, 7) - 1]} ${+iso.slice(8, 10)}`;
      const fmtNum = (n) => n.toLocaleString("en-US");
      const fmtUsd = (n) => "$" + Math.round(n).toLocaleString("en-US");
      const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : null);

      const data = () => (state.sample ? SAMPLE : REAL);
      const has = (D, k) =>
        ["connected", "sample"].includes(D.sources[k].status);
      const hasForms = (D) => has(D, "waitlist") || has(D, "requests");
      const inWin = (d, w) => d >= w[0] && d <= w[1];
      const wsMatch = (o) => state.ws === "all" || o.workshop === state.ws;
      const isPaid = (o) => o.status === "paid" && o.refunded < o.amount;

      function windows(D) {
        const end = D.today;
        if (state.range === "all")
          return { cur: ["0000-01-01", end], prev: null };
        const n = +state.range,
          start = addDays(end, -(n - 1));
        return {
          cur: [start, end],
          prev: [addDays(start, -n), addDays(start, -1)],
        };
      }

      function metrics(D, w) {
        const orders = D.orders.filter((o) => inWin(o.date, w) && wsMatch(o));
        const paid = orders.filter(isPaid);
        const visits = D.visits.filter((v) => inWin(v.date, w));
        return {
          visitors: visits.reduce((s, v) => s + v.visitors, 0),
          clicks: visits.reduce((s, v) => s + v.registerClicks, 0),
          waitlist: D.waitlist.filter((r) => inWin(r.date, w)).length,
          requests: D.requests.filter((r) => inWin(r.date, w)).length,
          checkouts: orders.length,
          paidOrders: paid.length,
          students: paid.reduce((s, o) => s + o.students, 0),
          revenue: orders.reduce(
            (s, o) => s + (o.status === "paid" ? o.amount - o.refunded : 0),
            0,
          ),
        };
      }

      function seatRows(D) {
        return D.config.workshops
          .filter((w) => state.ws === "all" || w.key === state.ws)
          .map((w) => {
            const paid = D.orders
              .filter((o) => o.workshop === w.key && isPaid(o))
              .reduce((s, o) => s + o.students, 0);
            return { ...w, paid, left: Math.max(0, w.capacity - paid) };
          });
      }

      // ── Header, filters, sources ────────────────────────────────────────

      function renderChrome(D) {
        const when = new Date(D.generatedAt);
        $("updated").textContent = D.sample
          ? `Sample numbers as of ${fmtDay(D.today)}, ${D.today.slice(0, 4)}`
          : `Updated ${when.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;

        const btn = $("sampleBtn");
        btn.hidden = !REAL;
        btn.textContent = state.sample
          ? "Back to real numbers"
          : "Preview with sample numbers";

        const banner = $("banner");
        banner.hidden = !state.sample;
        banner.textContent = REAL
          ? "Sample numbers, not real. Use “Back to real numbers” to return."
          : "Sample numbers, not real. Nothing is connected yet: add the keys to .env, then run node refresh.mjs.";

        $("rangeSeg").innerHTML = RANGES.map(
          ([k, l]) =>
            `<button data-range="${k}" aria-pressed="${state.range === k}">${l}</button>`,
        ).join("");
        const ws = [
          ["all", "All"],
          ...D.config.workshops.map((w) => [
            w.key,
            `${w.name} ${w.date.slice(5, 7)}.${w.date.slice(8, 10)}`,
          ]),
        ];
        $("wsSeg").innerHTML = ws
          .map(
            ([k, l]) =>
              `<button data-ws="${k}" aria-pressed="${state.ws === k}">${esc(l)}</button>`,
          )
          .join("");

        const ICON = {
          connected: ["✓", "var(--good)"],
          missing: ["○", "var(--ink-3)"],
          error: ["!", "var(--crit)"],
          sample: ["◆", "var(--ink-3)"],
        };
        $("sources").innerHTML = Object.entries(D.sources)
          .map(([k, s]) => {
            const [glyph, color] = ICON[s.status] || ICON.missing;
            return `<div class="src"><span style="color:${color}" aria-hidden="true">${glyph}</span><b>${SOURCE_NAMES[k]}</b><span class="why">${esc(s.note)}</span></div>`;
          })
          .join("");

        $("reminders").innerHTML =
          `<b>Reminders</b>` +
          D.config.reminders.map((r) => `<span>${esc(r)}</span>`).join("");
      }

      // ── KPI tiles ────────────────────────────────────────────────────────

      function delta(cur, prev) {
        if (prev == null) return "";
        if (prev === 0) return cur > 0 ? "New this period" : "";
        const p = Math.round(((cur - prev) / prev) * 100);
        const up = p >= 0;
        return `<span style="color:var(${up ? "--good" : "--crit"})" aria-hidden="true">${up ? "▲" : "▼"}</span> ${up ? "up" : "down"} ${Math.abs(p)}% vs previous ${state.range} days`;
      }

      function renderTiles(D) {
        const w = windows(D),
          m = metrics(D, w.cur);
        // Compare with the previous period only when that whole period has
        // data; a half-empty one makes every number look like a huge jump.
        const since = (rows) =>
          rows.reduce((min, r) => (r.date < min ? r.date : min), "9999");
        const covered = (rows) => w.prev && since(rows) <= w.prev[0];
        const prev = w.prev ? metrics(D, w.prev) : null;
        const p = {
          visitors: covered(D.visits) ? prev.visitors : null,
          checkouts: covered(D.orders) ? prev.checkouts : null,
          students: covered(D.orders) ? prev.students : null,
          revenue: covered(D.orders) ? prev.revenue : null,
        };
        const seats = seatRows(D);
        const sP = has(D, "plausible"),
          sS = has(D, "stripe"),
          sF = hasForms(D);
        const tiles = [
          {
            l: "Visitors",
            ok: sP,
            v: fmtNum(m.visitors),
            s: delta(m.visitors, p.visitors) || "Whole site",
            need: NEED.plausible,
          },
          {
            l: "Signups",
            ok: sF,
            v: fmtNum(m.waitlist + m.requests),
            s: `${m.waitlist} waitlist · ${m.requests} requests`,
            need: NEED.forms,
          },
          {
            l: "Checkouts started",
            ok: sS,
            v: fmtNum(m.checkouts),
            s: delta(m.checkouts, p.checkouts),
            need: NEED.stripe,
          },
          {
            l: "Paid students",
            ok: sS,
            v: fmtNum(m.students),
            s: [`${m.paidOrders} orders`, delta(m.students, p.students)]
              .filter(Boolean)
              .join(" · "),
            need: NEED.stripe,
            accent: true,
          },
          {
            l: "Revenue",
            ok: sS,
            v: fmtUsd(m.revenue),
            s: delta(m.revenue, p.revenue) || "After refunds",
            need: NEED.stripe,
          },
          {
            l: "Seats left",
            ok: sS,
            v: fmtNum(seats.reduce((s, r) => s + r.left, 0)),
            s: `of ${seats.reduce((s, r) => s + r.capacity, 0)} · all time`,
            need: NEED.stripe,
          },
        ];
        $("tiles").innerHTML = tiles
          .map(
            (t) => `
          <div class="tile${t.accent ? " accent" : ""}">
            <div class="l">${t.l}</div>
            <div class="v${t.ok ? "" : " na"}">${t.ok ? t.v : "—"}</div>
            <div class="s">${t.ok ? t.s || "&nbsp;" : t.need}</div>
          </div>`,
          )
          .join("");
      }

      // ── Charts ───────────────────────────────────────────────────────────

      const empty = (msg) => `<div class="empty">${esc(msg)}</div>`;
      const table = (head, rows) =>
        `<table><thead><tr>${head.map((h, i) => `<th class="${i ? "n" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${rows
          .map(
            (r) =>
              `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}">${esc(c)}</td>`).join("")}</tr>`,
          )
          .join("")}</tbody></table>`;

      // Horizontal bar: square at the baseline, 4px rounded data end.
      function hbar(x, y, w, h) {
        const r = Math.min(4, w / 2, h / 2);
        if (w <= 0) return "";
        return `M${x},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}H${x}Z`;
      }

      // Whole-number ticks on a 1-2-5 step, about four of them.
      function niceScale(v) {
        if (v <= 0) return { max: 4, step: 1 };
        const raw = v / 4,
          p = Math.pow(10, Math.floor(Math.log10(raw))),
          n = raw / p;
        const step = Math.max(
          1,
          (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p,
        );
        return { max: Math.ceil(v / step) * step, step };
      }

      function renderFunnel(D, el) {
        const m = metrics(D, windows(D).cur);
        const sP = has(D, "plausible"),
          sS = has(D, "stripe");
        const signups = m.waitlist + m.requests;
        const steps = [
          {
            label: "Visitors",
            value: sP ? m.visitors : null,
            need: NEED.plausible,
          },
          {
            label: "Clicked Register",
            value: sP ? m.clicks : null,
            need: NEED.plausible,
          },
          {
            label: "Started checkout",
            value: sS ? m.checkouts : null,
            need: NEED.stripe,
          },
          {
            label: "Paid orders",
            value: sS ? m.paidOrders : null,
            need: NEED.stripe,
          },
        ];
        if (steps.every((s) => s.value == null))
          return empty("Connect Plausible or Stripe to see the funnel");

        const gaps = [
          sP && m.visitors
            ? {
                drop: true,
                text: `Drop-off 1: ${100 - pct(Math.min(m.visitors, m.clicks + signups), m.visitors)}% left without acting${hasForms(D) ? ` · ${fmtNum(signups)} signed up for later` : ""}`,
              }
            : null,
          sP && sS && m.clicks
            ? {
                text: `${Math.min(100, pct(m.checkouts, m.clicks))}% of clicks reached Stripe`,
              }
            : null,
          sS && m.checkouts
            ? {
                drop: true,
                text: `Drop-off 2: ${100 - pct(m.paidOrders, m.checkouts)}% abandoned checkout`,
              }
            : null,
        ];

        if (state.tables.funnel) {
          return table(
            ["Stage", "Count", "Share of previous"],
            steps.map((s, i) => [
              s.label,
              s.value == null ? s.need : fmtNum(s.value),
              i && s.value != null && steps[i - 1].value
                ? `${pct(s.value, steps[i - 1].value)}%`
                : "",
            ]),
          );
        }

        const W = el.clientWidth,
          labelW = Math.min(132, W * 0.34),
          valueW = 56;
        const barMax = Math.max(40, W - labelW - valueW),
          barH = 20,
          rowH = 26;
        const max = Math.max(...steps.map((s) => s.value || 0), 1);
        const shades = [0.4, 0.58, 0.78, 1];
        let y = 0,
          out = "";
        steps.forEach((s, i) => {
          out += `<text x="0" y="${y + 14}" font-size="13" fill="var(--ink-2)">${s.label}</text>`;
          if (s.value == null) {
            out += `<text x="${labelW}" y="${y + 14}" font-size="12.5" fill="var(--ink-3)">${s.need}</text>`;
          } else {
            const w = Math.max(2, (s.value / max) * barMax);
            const share =
              i && steps[0].value
                ? ` · ${pct(s.value, steps[0].value)}% of visitors`
                : "";
            out += `<path class="mark" tabindex="0" d="${hbar(labelW, y, w, barH)}" fill="var(--s1)" fill-opacity="${shades[i]}" data-tip="${esc(`${s.label}: ${fmtNum(s.value)}${share}`)}"/>`;
            out += `<text x="${labelW + w + 8}" y="${y + 14}" font-size="13" font-weight="600" fill="var(--ink)">${fmtNum(s.value)}</text>`;
          }
          y += rowH;
          if (i < 3) {
            const g = gaps[i];
            // Narrow screens: start under the labels and break at " · ".
            const ax = W < 480 ? 0 : labelW;
            const lines = !g
              ? []
              : g.text.length * 6.4 + 16 > W - ax
                ? g.text.split(" · ")
                : [g.text];
            lines.forEach((line, k) => {
              const mark =
                g.drop && k === 0 ? `<tspan fill="var(--crit)">▼ </tspan>` : "";
              out += `<text x="${ax}" y="${y + 13 + k * 16}" font-size="12" fill="var(--ink-2)">${mark}${esc(line)}</text>`;
            });
            y += 10 + 16 * Math.max(1, lines.length);
          }
        });
        const notes = [];
        if (state.ws !== "all" && sP)
          notes.push(
            "Visitors and clicks are for the whole site; checkouts and payments are for this workshop.",
          );
        notes.push(...D.config.notes);
        return (
          `<svg width="${W}" height="${y}" role="img" aria-label="Funnel from visitors to paid orders">${out}</svg>` +
          notes.map((n) => `<div class="note">${esc(n)}</div>`).join("")
        );
      }

      function trendData(D) {
        const w = windows(D).cur,
          daily = state.range === "7" || state.range === "30";
        let start = w[0];
        if (state.range === "all") {
          const dates = [...D.orders, ...D.waitlist, ...D.requests, ...D.visits]
            .map((r) => r.date)
            .sort();
          start = dates[0] || addDays(D.today, -89);
        }
        const bucketOf = (iso) => {
          if (daily) return iso;
          const dow = (new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7;
          return addDays(iso, -dow);
        };
        const keys = [];
        for (let k = bucketOf(start); k <= w[1]; k = addDays(k, daily ? 1 : 7))
          keys.push(k);
        const idx = Object.fromEntries(keys.map((k, i) => [k, i]));
        const signups = keys.map(() => 0),
          paid = keys.map(() => 0);
        [...D.waitlist, ...D.requests].forEach((r) => {
          if (inWin(r.date, [start, w[1]])) signups[idx[bucketOf(r.date)]]++;
        });
        D.orders.forEach((o) => {
          if (isPaid(o) && wsMatch(o) && inWin(o.date, [start, w[1]]))
            paid[idx[bucketOf(o.date)]] += o.students;
        });
        const series = [];
        if (hasForms(D))
          series.push({ label: "Signups", color: "var(--s1)", vals: signups });
        if (has(D, "stripe"))
          series.push({
            label: "Paid students",
            color: "var(--s2)",
            vals: paid,
          });
        return { keys, daily, series };
      }

      function renderTrend(D, el) {
        const { keys, daily, series } = trendData(D);
        const periodLabel = (k) => (daily ? fmtDay(k) : `Week of ${fmtDay(k)}`);
        $("trendSub").textContent =
          `${daily ? "By day" : "By week"}${state.ws === "all" ? "" : "; paid students for this workshop only"}`;
        if (!series.length)
          return empty("Connect Stripe or Plausible to see this");
        if (keys.length < 2) return empty("Not enough days in this period yet");

        if (state.tables.trend) {
          return table(
            ["Period", ...series.map((s) => s.label)],
            keys
              .map((k, i) => [
                periodLabel(k),
                ...series.map((s) => fmtNum(s.vals[i])),
              ])
              .reverse(),
          );
        }

        const W = el.clientWidth,
          H = 240,
          L = 36,
          R = 56,
          T = 26,
          B = 26;
        const pw = W - L - R,
          ph = H - T - B;
        const { max, step } = niceScale(
          Math.max(...series.flatMap((s) => s.vals)),
        );
        const x = (i) => L + (i / (keys.length - 1)) * pw;
        const y = (v) => T + ph - (v / max) * ph;
        let out = "";
        for (let v = 0; v <= max + 1e-9; v += step) {
          out += `<line x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/>`;
          out += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${fmtNum(Math.round(v))}</text>`;
        }
        const every = Math.max(1, Math.ceil(keys.length / 5));
        keys.forEach((k, i) => {
          if (i % every === 0)
            out += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${fmtDay(k)}</text>`;
        });
        // Workshop dates as reference lines.
        const span = daily ? 1 : 7;
        D.config.workshops
          .filter((w) => state.ws === "all" || w.key === state.ws)
          .forEach((w) => {
            const pos = daysBetween(keys[0], w.date) / span;
            if (pos < 0 || pos > keys.length - 1) return;
            const xx = L + (pos / (keys.length - 1)) * pw;
            out += `<line x1="${xx}" x2="${xx}" y1="${T - 6}" y2="${T + ph}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
            out += `<text x="${xx}" y="${T - 10}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(w.name)} ${w.date.slice(5, 7)}.${w.date.slice(8, 10)}</text>`;
          });
        series.forEach((s) => {
          out += `<path d="${s.vals.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        });
        // End dots and end values, unless they would collide.
        const last = keys.length - 1;
        const ends = series.map((s) => y(s.vals[last]));
        const collide = ends.length === 2 && Math.abs(ends[0] - ends[1]) < 14;
        series.forEach((s, j) => {
          out += `<circle cx="${x(last)}" cy="${ends[j]}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
          if (!collide)
            out += `<text x="${x(last) + 9}" y="${ends[j] + 4}" font-size="12" font-weight="600" fill="var(--ink)">${fmtNum(s.vals[last])}</text>`;
        });
        out += `<line id="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--axis)" visibility="hidden"/>`;
        series.forEach((s, j) => {
          out += `<circle id="xh${j}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
        });
        out += `<rect id="xhit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>`;

        const legend =
          series.length > 1
            ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>`
            : "";
        requestAnimationFrame(() =>
          wireCrosshair(el, { keys, series, x, y, periodLabel, L, pw }),
        );
        return `${legend}<svg width="${W}" height="${H}" role="img" aria-label="${series.map((s) => s.label).join(" and ")} over time">${out}</svg>`;
      }

      function wireCrosshair(el, c) {
        const hit = el.querySelector("#xhit");
        if (!hit) return;
        const xh = el.querySelector("#xh");
        const move = (ev) => {
          const r = hit.getBoundingClientRect();
          const i = Math.max(
            0,
            Math.min(
              c.keys.length - 1,
              Math.round(
                ((ev.clientX - r.left) / r.width) * (c.keys.length - 1),
              ),
            ),
          );
          xh.setAttribute("x1", c.x(i));
          xh.setAttribute("x2", c.x(i));
          xh.setAttribute("visibility", "visible");
          c.series.forEach((s, j) => {
            const dot = el.querySelector("#xh" + j);
            dot.setAttribute("cx", c.x(i));
            dot.setAttribute("cy", c.y(s.vals[i]));
            dot.setAttribute("visibility", "visible");
          });
          showTip(
            `<b>${c.periodLabel(c.keys[i])}</b><br>` +
              c.series
                .map((s) => `${s.label}: ${fmtNum(s.vals[i])}`)
                .join("<br>"),
            ev.clientX,
            ev.clientY,
          );
        };
        hit.addEventListener("mousemove", move);
        hit.addEventListener("mouseleave", () => {
          xh.setAttribute("visibility", "hidden");
          c.series.forEach((s, j) =>
            el.querySelector("#xh" + j).setAttribute("visibility", "hidden"),
          );
          hideTip();
        });
      }

      function renderHeard(D, el) {
        if (!has(D, "waitlist")) return empty("Needs Plausible");
        if (!D.sources.waitlist.withProp)
          return empty(
            "Plausible counts signups but does not break them down by answer on this plan",
          );
        const w = windows(D).cur,
          counts = {};
        D.waitlist
          .filter((r) => inWin(r.date, w))
          .forEach((r) => {
            const k = r.heardFrom || "Not answered";
            counts[k] = (counts[k] || 0) + 1;
          });
        const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        if (!rows.length) return empty("No waitlist signups in this period");
        const total = rows.reduce((s, r) => s + r[1], 0);
        if (state.tables.heard)
          return table(
            ["Source", "Signups", "Share"],
            rows.map(([k, v]) => [k, fmtNum(v), `${pct(v, total)}%`]),
          );

        const W = el.clientWidth,
          valueW = 64,
          barMax = W - valueW,
          rowH = 40,
          max = rows[0][1];
        let out = "";
        rows.forEach(([k, v], i) => {
          const y = i * rowH,
            bw = Math.max(2, (v / max) * barMax);
          out += `<text x="0" y="${y + 12}" font-size="13" fill="var(--ink-2)">${esc(k)}</text>`;
          out += `<path class="mark" tabindex="0" d="${hbar(0, y + 18, bw, 14)}" fill="var(--s1)" data-tip="${esc(`${k}: ${v} signups, ${pct(v, total)}%`)}"/>`;
          out += `<text x="${bw + 8}" y="${y + 30}" font-size="12.5" font-weight="600" fill="var(--ink)">${fmtNum(v)}<tspan font-weight="400" fill="var(--ink-3)"> · ${pct(v, total)}%</tspan></text>`;
        });
        return `<svg width="${W}" height="${rows.length * rowH - 4}" role="img" aria-label="Waitlist signups by how they heard about YXO">${out}</svg>`;
      }

      function renderSeats(D) {
        if (!has(D, "stripe"))
          return empty("Needs Lily's Stripe to count paid students");
        return seatRows(D)
          .map((r) => {
            const until = daysBetween(D.today, r.date);
            const when =
              until > 1
                ? `in ${until} days`
                : until === 1
                  ? "tomorrow"
                  : until === 0
                    ? "today"
                    : "done";
            return `<div class="seat">
            <div class="seat-top"><b>${esc(r.name)} · ${fmtDay(r.date)}</b><span>${when}</span></div>
            <div class="meter" role="img" aria-label="${r.paid} of ${r.capacity} seats paid"><div style="width:${Math.min(100, (r.paid / r.capacity) * 100)}%"></div></div>
            <div class="seat-num"><b>${r.left} seats left</b> · ${r.paid} of ${r.capacity} paid</div>
          </div>`;
          })
          .join("");
      }

      // ── Tooltip ──────────────────────────────────────────────────────────

      const tip = $("tip");
      function showTip(html, cx, cy) {
        tip.innerHTML = html;
        tip.classList.add("on");
        const r = tip.getBoundingClientRect();
        let left = cx + 14,
          topY = cy + 14;
        if (left + r.width > innerWidth - 8) left = cx - r.width - 14;
        if (topY + r.height > innerHeight - 8) topY = cy - r.height - 14;
        tip.style.left = left + "px";
        tip.style.top = topY + "px";
      }
      function hideTip() {
        tip.classList.remove("on");
      }
      document.addEventListener("mousemove", (e) => {
        const t = e.target.closest && e.target.closest("[data-tip]");
        if (t) showTip(esc(t.dataset.tip), e.clientX, e.clientY);
        else if (!e.target.closest || !e.target.closest("#xhit")) hideTip();
      });
      document.addEventListener("focusin", (e) => {
        const t = e.target.closest("[data-tip]");
        if (!t) return;
        const r = t.getBoundingClientRect();
        showTip(esc(t.dataset.tip), r.right, r.top);
      });
      document.addEventListener("focusout", hideTip);

      // ── Wiring ───────────────────────────────────────────────────────────

      function render() {
        const D = data();
        renderChrome(D);
        renderTiles(D);
        const body = (id) => document.querySelector(`#${id} .chart`);
        body("funnel").innerHTML = renderFunnel(D, body("funnel"));
        body("trend").innerHTML = renderTrend(D, body("trend"));
        body("heard").innerHTML = renderHeard(D, body("heard"));
        body("seats").innerHTML = renderSeats(D);
        document.querySelectorAll("[data-table]").forEach((b) => {
          b.textContent = state.tables[b.dataset.table] ? "Chart" : "Table";
        });
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.range) state.range = b.dataset.range;
        else if (b.dataset.ws) state.ws = b.dataset.ws;
        else if (b.dataset.table)
          state.tables[b.dataset.table] = !state.tables[b.dataset.table];
        else if (b.id === "sampleBtn") state.sample = !state.sample;
        else return;
        render();
      });
      let resizeTimer,
        lastWidth = innerWidth;
      addEventListener("resize", () => {
        if (innerWidth === lastWidth) return;
        lastWidth = innerWidth;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 120);
      });

      render();
    </script>
  </body>
</html>
